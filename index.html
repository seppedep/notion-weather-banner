<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weer Brussel</title>

<style>

/* =========================================
   BASIS
   ========================================= */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

body {
    overflow: hidden;
}


/* =========================================
   HOOFDBANNER
   ========================================= */

.weather-card {

    position: relative;

    width: 100%;
    height: 100vh;
    min-height: 220px;

    display: flex;
    align-items: center;

    color: white;

    overflow: hidden;

    background:
        linear-gradient(
            120deg,
            rgba(20, 90, 160, 0.60),
            rgba(90, 180, 230, 0.35)
        ),
        linear-gradient(
            120deg,
            #2774ae,
            #65c7f7
        );

    transition:
        background 1s ease;
}


/* =========================================
   DECORATIEVE LICHTVLEK
   ========================================= */

.background-glow {

    position: absolute;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    right: -120px;
    top: -180px;

    background:
        rgba(255,255,255,0.15);

    filter: blur(10px);
}


/* =========================================
   INHOUD
   ========================================= */

.content {

    position: relative;

    z-index: 2;

    width: 100%;

    height: 100%;

    padding: 28px 42px;

    display: flex;

    align-items: center;

}


/* =========================================
   LINKER BLOK
   ========================================= */

.current-weather {

    flex: 1;

    display: flex;

    align-items: center;

    gap: 25px;

    min-width: 0;

}


/* Locatie + temperatuur */

.current-info {

    display: flex;

    flex-direction: column;

    justify-content: center;

}


/* =========================================
   LOCATIE
   ========================================= */

.location {

    font-size:
        clamp(14px, 2vw, 20px);

    font-weight: 600;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: 0.9;

    margin-bottom: 3px;
}


/* =========================================
   GROTE TEMPERATUUR
   ========================================= */

.temperature {

    display: flex;

    align-items: flex-start;

    line-height: 0.9;
}

.temperature-number {

    font-size:
        clamp(70px, 10vw, 115px);

    font-weight: 300;

    letter-spacing: -6px;
}

.temperature-unit {

    font-size:
        clamp(24px, 3.5vw, 38px);

    font-weight: 300;

    margin-top: 7px;

    margin-left: 5px;
}


/* =========================================
   WEERICOON
   ========================================= */

.weather-icon {

    font-size:
        clamp(70px, 9vw, 105px);

    line-height: 1;

    flex-shrink: 0;

    filter:
        drop-shadow(
            0 6px 10px
            rgba(0,0,0,0.18)
        );
}


/* =========================================
   SCHEIDINGSLIJN
   ========================================= */

.divider {

    width: 1px;

    height: 135px;

    margin: 0 40px;

    background:
        rgba(255,255,255,0.28);
}


/* =========================================
   RECHTER BLOK
   ========================================= */

.details {

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 13px;

    min-width: 250px;

}


/* =========================================
   BESCHRIJVING
   ========================================= */

.description {

    font-size:
        clamp(17px, 2.2vw, 24px);

    font-weight: 500;

    margin-bottom: 5px;
}


/* =========================================
   DETAIL RIJEN
   ========================================= */

.detail-row {

    display: flex;

    align-items: center;

    gap: 12px;

    font-size:
        clamp(14px, 1.8vw, 18px);

    opacity: 0.9;
}


/* iconen */

.detail-icon {

    width: 27px;

    text-align: center;

    font-size: 20px;
}


/* labels */

.detail-label {

    opacity: 0.72;

    margin-right: 5px;
}


/* waarden */

.detail-value {

    font-weight: 600;
}


/* =========================================
   LOADING
   ========================================= */

.loading {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 18px;

    opacity: 0.8;
}


/* =========================================
   ERROR
   ========================================= */

.error {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    padding: 20px;
}

.error-title {

    font-size: 20px;

    font-weight: 600;

    margin-bottom: 8px;
}

.error-text {

    opacity: 0.75;

    font-size: 14px;
}


/* =========================================
   KLEINERE SCHERMEN
   ========================================= */

@media (max-width: 650px) {

    .content {

        padding: 20px 25px;

    }

    .current-weather {

        gap: 15px;

    }

    .divider {

        margin: 0 20px;

    }

    .details {

        min-width: 190px;

    }

}


/* =========================================
   ZEER SMALLE SCHERMEN
   ========================================= */

@media (max-width: 480px) {

    .content {

        padding: 20px;

    }

    .weather-icon {

        font-size: 60px;

    }

    .divider {

        margin: 0 15px;

    }

    .details {

        min-width: 160px;

    }

}

</style>
</head>


<body>


<div
    id="weatherCard"
    class="weather-card">


    <div class="background-glow"></div>


    <!-- =====================================
         CONTENT
         ===================================== -->

    <div
        id="content"
        class="content"
        style="display:none;">


        <!-- =================================
             LINKER BLOK
             ================================= -->

        <div class="current-weather">


            <!-- Locatie + temperatuur -->

            <div class="current-info">


                <div class="location">
                    Brussel
                </div>


                <div class="temperature">


                    <div
                        id="temperature"
                        class="temperature-number">

                        --

                    </div>


                    <div class="temperature-unit">

                        °C

                    </div>


                </div>


            </div>


            <!-- Weericoon -->

            <div
                id="weatherIcon"
                class="weather-icon">

                🌤️

            </div>


        </div>


        <!-- =================================
             SCHEIDING
             ================================= -->

        <div class="divider"></div>


        <!-- =================================
             RECHTER BLOK
             ================================= -->

        <div class="details">


            <!-- Weersomschrijving -->

            <div
                id="description"
                class="description">

                --

            </div>


            <!-- Min / Max -->

            <div class="detail-row">


                <div class="detail-icon">

                    🌡️

                </div>


                <div>

                    <span class="detail-label">
                        Vandaag
                    </span>


                    <span
                        id="minmax"
                        class="detail-value">

                        --° / --°

                    </span>

                </div>


            </div>


            <!-- Neerslag -->

            <div class="detail-row">


                <div class="detail-icon">

                    🌧️

                </div>


                <div>

                    <span class="detail-label">
                        Neerslagkans
                    </span>


                    <span
                        id="rain"
                        class="detail-value">

                        --%

                    </span>

                </div>


            </div>


        </div>


    </div>


    <!-- =====================================
         LOADING
         ===================================== -->

    <div
        id="loading"
        class="loading">

        Weer laden...

    </div>


</div>



<script>


/* =========================================
   INSTELLINGEN
   ========================================= */


const LATITUDE = 50.8503;

const LONGITUDE = 4.3517;


/*
Elke 15 minuten vernieuwen
*/

const REFRESH_INTERVAL =
    15 * 60 * 1000;



/* =========================================
   WEERCODES
   ========================================= */

function getWeatherInfo(
    code,
    isDay
) {


    if (code === 0) {

        return isDay

            ? {
                icon: "☀️",
                description: "Zonnig",
                type: "sunny"
            }

            : {
                icon: "🌙",
                description: "Heldere nacht",
                type: "night"
            };

    }


    if (code === 1) {

        return {

            icon:
                isDay
                    ? "🌤️"
                    : "🌙",

            description:
                "Overwegend helder",

            type:
                isDay
                    ? "sunny"
                    : "night"

        };

    }


    if (code === 2) {

        return {

            icon: "⛅",

            description:
                "Gedeeltelijk bewolkt",

            type: "cloudy"

        };

    }


    if (code === 3) {

        return {

            icon: "☁️",

            description:
                "Bewolkt",

            type: "cloudy"

        };

    }


    if (
        code === 45 ||
        code === 48
    ) {

        return {

            icon: "🌫️",

            description:
                "Mist",

            type: "fog"

        };

    }


    if (
        code >= 51 &&
        code <= 57
    ) {

        return {

            icon: "🌦️",

            description:
                "Lichte motregen",

            type: "rain"

        };

    }


    if (
        code >= 61 &&
        code <= 67
    ) {

        return {

            icon: "🌧️",

            description:
                "Regen",

            type: "rain"

        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {

            icon: "🌨️",

            description:
                "Sneeuw",

            type: "snow"

        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {

            icon: "🌦️",

            description:
                "Regenbuien",

            type: "rain"

        };

    }


    if (
        code === 85 ||
        code === 86
    ) {

        return {

            icon: "🌨️",

            description:
                "Sneeuwbuien",

            type: "snow"

        };

    }


    if (
        code === 95 ||
        code === 96 ||
        code === 99
    ) {

        return {

            icon: "⛈️",

            description:
                "Onweer",

            type: "storm"

        };

    }


    return {

        icon: "🌤️",

        description:
            "Wisselend bewolkt",

        type: "cloudy"

    };

}



/* =========================================
   ACHTERGROND
   ========================================= */

function setBackground(type) {


    const card =
        document.getElementById(
            "weatherCard"
        );


    let background;


    if (type === "sunny") {

        background = `
            linear-gradient(
                120deg,
                rgba(20,90,160,0.60),
                rgba(90,180,230,0.35)
            ),
            linear-gradient(
                120deg,
                #2774ae,
                #65c7f7
            )
        `;

    }


    else if (type === "night") {

        background = `
            linear-gradient(
                120deg,
                rgba(10,20,50,0.75),
                rgba(30,45,90,0.65)
            ),
            linear-gradient(
                120deg,
                #141e30,
                #243b55
            )
        `;

    }


    else if (type === "cloudy") {

        background = `
            linear-gradient(
                120deg,
                rgba(40,55,70,0.70),
                rgba(100,120,135,0.50)
            ),
            linear-gradient(
                120deg,
                #536976,
                #9aa7ad
            )
        `;

    }


    else if (type === "rain") {

        background = `
            linear-gradient(
                120deg,
                rgba(25,45,65,0.80),
                rgba(70,100,125,0.60)
            ),
            linear-gradient(
                120deg,
                #314755,
                #5d7280
            )
        `;

    }


    else if (type === "snow") {

        background = `
            linear-gradient(
                120deg,
                rgba(80,110,135,0.65),
                rgba(180,205,220,0.45)
            ),
            linear-gradient(
                120deg,
                #83a4d4,
                #b6fbff
            )
        `;

    }


    else if (type === "fog") {

        background = `
            linear-gradient(
                120deg,
                rgba(90,100,105,0.75),
                rgba(160,165,165,0.45)
            ),
            linear-gradient(
                120deg,
                #757f9a,
                #d7dde8
            )
        `;

    }


    else if (type === "storm") {

        background = `
            linear-gradient(
                120deg,
                rgba(15,20,35,0.85),
                rgba(55,65,90,0.65)
            ),
            linear-gradient(
                120deg,
                #232526,
                #414345
            )
        `;

    }


    card.style.background =
        background;

}



/* =========================================
   WEER OPHALEN
   ========================================= */

async function loadWeather() {


    const loading =
        document.getElementById(
            "loading"
        );


    const content =
        document.getElementById(
            "content"
        );


    try {


        const url =

            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            LATITUDE +

            "&longitude=" +
            LONGITUDE +

            "&current=" +
            "temperature_2m," +
            "weather_code," +
            "is_day" +

            "&daily=" +
            "temperature_2m_min," +
            "temperature_2m_max," +
            "precipitation_probability_max" +

            "&timezone=Europe%2FBrussels" +

            "&forecast_days=1";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Weather API error"
            );

        }


        const data =
            await response.json();


        /* =================================
           DATA
           ================================= */


        const temperature =
            Math.round(
                data.current
                    .temperature_2m
            );


        const weatherCode =
            data.current
                .weather_code;


        const isDay =
            data.current
                .is_day === 1;


        const minimum =
            Math.round(
                data.daily
                    .temperature_2m_min[0]
            );


        const maximum =
            Math.round(
                data.daily
                    .temperature_2m_max[0]
            );


        const precipitation =
            Math.round(
                data.daily
                    .precipitation_probability_max[0]
            );


        /* =================================
           WEERINFO
           ================================= */


        const weather =
            getWeatherInfo(
                weatherCode,
                isDay
            );


        /* =================================
           SCHERM INVULLEN
           ================================= */


        document
            .getElementById(
                "temperature"
            )
            .textContent =
            temperature;


        document
            .getElementById(
                "description"
            )
            .textContent =
            weather.description;


        document
            .getElementById(
                "weatherIcon"
            )
            .textContent =
            weather.icon;


        document
            .getElementById(
                "minmax"
            )
            .textContent =
            minimum +
            "° / " +
            maximum +
            "°";


        document
            .getElementById(
                "rain"
            )
            .textContent =
            precipitation +
            "%";


        /* =================================
           ACHTERGROND
           ================================= */


        setBackground(
            weather.type
        );


        /* =================================
           TONEN
           ================================= */


        loading.style.display =
            "none";


        content.style.display =
            "flex";


    }


    catch (error) {


        console.error(error);


        loading.style.display =
            "none";


        document.getElementById(
            "weatherCard"
        ).innerHTML = `

            <div class="error">

                <div class="error-title">
                    🌧️ Weer tijdelijk niet beschikbaar
                </div>

                <div class="error-text">
                    De weergegevens konden niet
                    worden opgehaald.
                </div>

            </div>

        `;

    }

}



/* =========================================
   START
   ========================================= */


loadWeather();


/*
Elke 15 minuten vernieuwen
*/

setInterval(
    loadWeather,
    REFRESH_INTERVAL
);


</script>

</body>
</html>
